<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181F"/>
      <stop offset="50%" stop-color="#08090B"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Скруглённый фон -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Внутреннее красное свечение -->
  <circle cx="256" cy="256" r="160" fill="#E63946" opacity="0.12" filter="url(#glow)"/>

  <!-- Гриф штанги -->
  <rect x="76" y="246" width="360" height="20" rx="8" fill="url(#chromeGrad)"/>
  <!-- Втулки и замки -->
  <rect x="136" y="226" width="16" height="60" rx="4" fill="#CBD5E1"/>
  <rect x="360" y="226" width="16" height="60" rx="4" fill="#CBD5E1"/>

  <!-- Соревновательные диски (Красные 25 кг) -->
  <rect x="96" y="156" width="32" height="200" rx="10" fill="url(#crimsonGrad)" filter="url(#glow)"/>
  <rect x="384" y="156" width="32" height="200" rx="10" fill="url(#crimsonGrad)" filter="url(#glow)"/>
  <rect x="68" y="176" width="22" height="160" rx="8" fill="#1E293B"/>
  <rect x="422" y="176" width="22" height="160" rx="8" fill="#1E293B"/>

  <!-- Текстовая монограмма ЖД в центре -->
  <text x="256" y="274" font-family="'Unbounded', -apple-system, sans-serif" font-weight="900" font-size="78" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">ЖД</text>
  <text x="256" y="324" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="20" fill="#FF3B30" text-anchor="middle" letter-spacing="4">IRON DIARY</text>
</svg>
