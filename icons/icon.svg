<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141821"/>
      <stop offset="0.5" stop-color="#0A0C10"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F5F8"/>
      <stop offset="0.48" stop-color="#AEB6C4"/>
      <stop offset="1" stop-color="#565D6A"/>
    </linearGradient>
    <linearGradient id="plateRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C23F3A"/>
      <stop offset="1" stop-color="#7D2320"/>
    </linearGradient>
    <linearGradient id="plateBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3866AE"/>
      <stop offset="1" stop-color="#1E3966"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Barbell shaft -->
  <rect x="44" y="246" width="424" height="20" rx="4" fill="url(#steel)"/>
  <!-- Inner sleeves -->
  <rect x="134" y="226" width="16" height="60" rx="4" fill="url(#steel)"/>
  <rect x="362" y="226" width="16" height="60" rx="4" fill="url(#steel)"/>
  <!-- 25 kg Competition Plates -->
  <rect x="98" y="136" width="30" height="240" rx="7" fill="url(#plateRed)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
  <rect x="384" y="136" width="30" height="240" rx="7" fill="url(#plateRed)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
  <!-- 20 kg Competition Plates -->
  <rect x="68" y="148" width="24" height="216" rx="6" fill="url(#plateBlue)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <rect x="420" y="148" width="24" height="216" rx="6" fill="url(#plateBlue)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <!-- Center calibration mark -->
  <circle cx="256" cy="256" r="8" fill="#63B8EE"/>
</svg>
